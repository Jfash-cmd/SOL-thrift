<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2306b6d4' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/><path d='m9 12 2 2 4-4'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solthrift: save together without trusting anyone</title>
    <meta name="description" content="A savings circle on Solana where a program holds the money, pays out in turn, and removes people who miss a payment." />
    <meta name="theme-color" content="#0a0d14" />
    <!-- Preload only the woff2 font files used by Solthrift -->
    <link rel="preload" href="/fonts/poppins-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/poppins-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/poppins-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/instrument-serif-latin-400-italic.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Font-readiness gate: hide initial paint until fonts are ready, max 1s -->
    <script>
      (function() {
        var doc = document.documentElement;
        doc.classList.add('fonts-loading');
        var reveal = function() {
          doc.classList.remove('fonts-loading');
          doc.classList.add('fonts-ready');
        };
        var timer = setTimeout(reveal, 1000);
        if ('fonts' in document) {
          document.fonts.ready.then(function() {
            clearTimeout(timer);
            reveal();
          }).catch(function() {
            clearTimeout(timer);
            reveal();
          });
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
